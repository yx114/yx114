name: Generate contribution snake

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/snake.svg?color_snake=#e08a3c&color_dots=#ebedf0,#c5e8a0,#86cf50,#5da231,#3d7a3a
            dist/snake-dark.svg?color_snake=#e08a3c&color_dots=#161b22,#2f5a2a,#3d7a3a,#5da231,#86cf50

      - uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
