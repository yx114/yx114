
name: Update streak stats

on:
  workflow_dispatch:
  schedule:
    - cron: "41 */12 * * *"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Download streak cards
        env:
          BASE_URL: "https://streak-stats.demolab.com/?user=yx114&hide_border=true&background=00000000&ring=F4795B&fire=F4795B&currStreakLabel=F4795B&timezone=Asia%2FKuala_Lumpur"
        run: |
          set -e

          fetch() {
            file="$1"
            colors="$2"

            for attempt in 1 2 3; do
              if curl -fLsS --max-time 90 \
                "${BASE_URL}&${colors}" \
                -o "${file}.tmp" \
                && grep -q '<svg' "${file}.tmp" \
                && [ "$(wc -c < "${file}.tmp")" -gt 2000 ]; then
                mv "${file}.tmp" "$file"
                return 0
              fi
              sleep 10
            done

            rm -f "${file}.tmp"
            echo "Failed to update $file"
            return 1
          }

          fetch streak.svg \
            "sideNums=333333&currStreakNum=333333&sideLabels=555555&dates=888888"

          fetch streak-night.svg \
            "sideNums=E6EDF3&currStreakNum=E6EDF3&sideLabels=BBBBBB&dates=8B949E"

      - name: Save updated cards
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add streak.svg streak-night.svg

          if ! git diff --cached --quiet; then
            git commit -m "Update contribution streak"
            git push
          fi
